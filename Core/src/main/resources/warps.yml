        texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNzMwNDFjMmVhODI3YmY2NjFiNjQ3MmE4ZTMxMGY2NTFiMjk0ODNhNWZkN2U3NDEzOTdmOTZjMTUxNWIxNjgifX19'
