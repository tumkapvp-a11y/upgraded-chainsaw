# ----------------------------------------------------------
#  Топы: /baltop, /killtop, /deathtop
#  Списки обновляются в фоне раз в refresh-minutes минут; команды показывают последний результат.
# ----------------------------------------------------------
tops:
  # Интервал обновления в минутах (1–1440)
  refresh-minutes: 5
  # Сколько игроков показывать (1–100)
  size: 10
  # SQL-запрос топа по балансу: должен вернуть (ник, баланс) и содержать ровно один «?» — лимит строк.
  # Таблицу economy_accounts создаёт плагин Economy. Пока её нет, /baltop недоступен (в консоль одно предупреждение).
  balance-query: 'SELECT name, balance FROM economy_accounts ORDER BY balance DESC LIMIT ?'
