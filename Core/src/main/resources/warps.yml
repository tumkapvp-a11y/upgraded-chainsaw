        texture: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTgzYzZiYmRiYTZhODc3Zjk5NmQ4YzNkZDFkOWI4NDUwODViZTFiZGIyZjUzNWUyYjZmOGZjM2M2NTg5YjEifX19'
      '3':
