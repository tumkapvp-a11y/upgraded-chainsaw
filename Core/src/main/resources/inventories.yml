# ==========================================================
#  Core — эндер-сундук, /invsee и переносные верстаки
#  Все тексты — MiniMessage (https://docs.advntr.dev/minimessage/format.html).
#  Изменения применяются командой /core reload (уже открытые эндер-сундуки
#  сохраняют прежнюю разметку до закрытия).
# ==========================================================

# ----------------------------------------------------------
#  Многостраничный эндер-сундук (/enderchest, /ec, /echest)
#  Содержимое хранится в MySQL (таблица core_enderchests), по строке на страницу.
# ----------------------------------------------------------
enderchest:
  # Количество строк для предметов на каждой странице (1-5).
  # Под ними всегда есть ещё одна строка навигации.
  # Если уменьшить значение, страницы с предметами в «лишних» строках сохранят свой размер — ничего не пропадёт.
  storage-rows: 3
  # Сколько страниц есть у каждого игрока без дополнительных прав.
  default-pages: 1
  # Максимум страниц. Игрок получает N страниц за право core.enderchest.pages.<N> (N от 2 до max-pages,
  # учитывается наибольшее).
  max-pages: 6
  # Открывать этот эндер-сундук вместо обычного при нажатии ПКМ по блоку эндер-сундука.
  # Игроки без права core.enderchest открывают обычный.
  replace-vanilla: true
  # При первом открытии, если новый эндер-сундук пуст, перенести в него содержимое обычного
  # эндер-сундука игрока. Обычный сундук очищается только после успешного сохранения в базу.
  import-vanilla: true
  # Заголовок страницы. Подстановки: <owner> — владелец, <page> — номер страницы, <pages> — всего страниц.
  title: '<dark_gray>Эндер-сундук <owner> <dark_gray>(<page>/<pages>)'
  # Звуки открытия и закрытия (ключ звука Minecraft; пустой key — без звука).
  open-sound:
    key: 'block.ender_chest.open'
    volume: 0.5
    pitch: 1.0
  close-sound:
    key: 'block.ender_chest.close'
    volume: 0.5
    pitch: 1.0
  # Нижняя строка навигации. Слоты кнопок — от 0 до 8 внутри этой строки и не должны совпадать.
  # Строка всегда целиком заполнена, предметы в неё положить нельзя.
  # Подстановки: <page>, <pages>, <previous> — номер предыдущей страницы, <next> — номер следующей, <owner>.
  navigation:
    filler: BLACK_STAINED_GLASS_PANE
    previous:
      slot: 0
      material: ARROW
      name: '<gray>Предыдущая страница'
      lore:
        - '<gray>Перейти на страницу <gold><previous>'
    next:
      slot: 8
      material: ARROW
      name: '<gray>Следующая страница'
      lore:
        - '<gray>Перейти на страницу <gold><next>'
    info:
      slot: 4
      material: ENDER_EYE
      name: '<light_purple>Страница <page> из <pages>'
      lore:
        - '<gray>Больше страниц — у привилегий'

# ----------------------------------------------------------
#  Просмотр инвентаря игрока (/invsee <игрок>)
#  Без права core.invsee.modify инвентарь открывается только для просмотра.
#  Инвентарь игроков с правом core.invsee.exempt открыть нельзя.
# ----------------------------------------------------------
invsee:
  # Писать в консоль, кто и чей инвентарь открыл.
  log-usage: true
  # Звук при открытии (пустой key — без звука).
  open-sound:
    key: 'item.armor.equip_generic'
    volume: 0.6
    pitch: 1.0

# ----------------------------------------------------------
#  Заголовки переносных верстаков
#  /workbench (/wb, /craft)               — верстак
#  /anvil                                 — наковальня
#  /carttable (/cartographytable)         — стол картографа
#  /etable (/enchanttable)                — стол зачарований (книжные полки считаются вокруг игрока)
#  /grindstone                            — точило
#  /loom                                  — ткацкий станок
#  /smithtable (/smithingtable)           — кузнечный стол
#  /stonecutter                           — камнерез
#  Права: core.workbench, core.anvil, core.carttable, core.etable, core.grindstone, core.loom,
#  core.smithtable, core.stonecutter.
# ----------------------------------------------------------
workstations:
  workbench: '<dark_gray>Верстак'
  anvil: '<dark_gray>Наковальня'
  cartography-table: '<dark_gray>Стол картографа'
  enchanting-table: '<dark_gray>Стол зачарований'
  grindstone: '<dark_gray>Точило'
  loom: '<dark_gray>Ткацкий станок'
  smithing-table: '<dark_gray>Кузнечный стол'
  stonecutter: '<dark_gray>Камнерез'
