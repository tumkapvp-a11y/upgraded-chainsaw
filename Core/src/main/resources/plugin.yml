name: Core
version: '${project.version}'
main: me.x1no4ekk.core.CorePlugin
api-version: '1.21'
author: x1no4ekk
description: 'Ядро сервера: пользователи, хомы через Рог телепортации, утилиты (Paper 1.21.11, MySQL)'
load: POSTWORLD

softdepend:
  - Vault
  - PlaceholderAPI
  - Economy

# Команды регистрируются через Brigadier API Paper (LifecycleEvents.COMMANDS), поэтому их нет в этом файле.

permissions:
  core.admin:
    description: 'Доступ к /core reload и /core horn'
    default: op
  core.sethome:
    description: 'Создание точек дома'
    default: true
  core.delhome:
    description: 'Удаление точек дома'
    default: true
  core.playerhome:
    description: 'Просмотр и телепортация к точкам дома других игроков'
    default: op
  core.horn.use:
    description: 'Использование Рога телепортации'
    default: true
  core.horn.craft:
    description: 'Крафт Рога телепортации'
    default: true
  core.horn.bypass-cooldown:
    description: 'Использование Рога телепортации без перезарядки'
    default: op
  core.homes.unlimited:
    description: 'Без ограничения количества точек дома'
    default: op
  core.teleport.bypass-warmup:
    description: 'Телепортация без задержки'
    default: op
  core.back.death:
    description: 'Возврат командой /back на место смерти'
    default: true
  core.combat.bypass:
    description: 'Не входить в режим боя'
    default: false
  core.vanish:
    description: 'Режим невидимости'
    default: op
  core.vanish.see:
    description: 'Видеть игроков в невидимости'
    default: op
