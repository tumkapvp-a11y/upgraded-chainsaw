# ---------------------------------------------------------- топы (/baltop, /killtop, /deathtop)
# <updated> — сколько времени прошло с последнего обновления списка
tops:
  usage: '<prefix><gray>Использование: <red>/<command>'
  not-ready: '<prefix><gray>Топ ещё не сформирован, попробуйте чуть позже.'
  empty: '<prefix><gray>В топе пока никого нет.'
  # Номер места (<place> в строке топа). <position> — номер
  place:
    first: '<green>[<position>]'
    second: '<yellow>[<position>]'
    third: '<gold>[<position>]'
    other: '<red>[<position>]'
  # Строка: <place>, <position>, <name> — ник, <value> — значение
  balance:
    header:
      - '<gold>[$]</gold> <white>ТОП по <gold>балансу</gold>:'
      - ''
    line: ' <place> <white><name></white><gray>:</gray> <gold><value></gold>'
    footer:
      - ''
      - '<gray>Обновлено <gold><updated></gold> назад.'
  kills:
    header:
      - '<gold>[⚔]</gold> <white>ТОП по <gold>убийствам</gold>:'
      - ''
    line: ' <place> <white><name></white><gray>:</gray> <gold><value></gold>'
    footer:
      - ''
      - '<gray>Обновлено <gold><updated></gold> назад.'
  deaths:
    header:
      - '<gold>[☠]</gold> <white>ТОП по <gold>смертям</gold>:'
      - ''
    line: ' <place> <white><name></white><gray>:</gray> <gold><value></gold>'
    footer:
      - ''
      - '<gray>Обновлено <gold><updated></gold> назад.'

# ---------------------------------------------------------- KillerMoney (настройки в killermoney.yml)
# <amount> — сумма, <player> — второй игрок (жертва для убийцы и наоборот), <entity> — моб
killer-money:
  killer: '<prefix><gray>Вы получили <gold><amount></gold> с игрока <gold><player></gold>.'
  killer-actionbar: '<yellow>+<amount></yellow> <gray>за убийство <gold><player></gold>'
  victim: '<prefix><gray>Вы потеряли <red><amount></red>: вас убил <gold><player></gold>.'
  victim-actionbar: '<red>-<amount></red>'
  mob: '<prefix><gray>Вы получили <gold><amount></gold> за убийство <gold><entity></gold>.'
  mob-actionbar: '<yellow>+<amount></yellow> <gray>за <entity>'
